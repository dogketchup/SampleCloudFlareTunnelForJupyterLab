services:
  app:
    build: ./
    image: ${JUPYTER_LAB_CONTAINER}
    container_name: jupyter-lab-host-dup
    ports:
      - "8889:8889"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./projects:/app/projects
    environment:
      - JUPYTER_TOKEN=${SECRET_PASSWORD}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest              # Pull the latest version of the Cloudflare Tunnel image
    container_name: cloudflare-tunnel-jupyter                 # Name of the Cloudflare Tunnel container
    hostname: cloudflare-tunnel                       # Hostname for the Cloudflare Tunnel container
    restart: unless-stopped                           # Restart the container unless manually stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${SECRET_TOKEN}



    




